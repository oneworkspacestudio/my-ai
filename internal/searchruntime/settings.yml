use_default_settings:
  engines:
    keep_only: [duckduckgo, brave, wikipedia, google, bing, yahoo]
general:
  debug: false
  enable_metrics: false
search:
  formats: [json]
  autocomplete: ''
  default_lang: en
  safe_search: 1
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: wikipedia
    display_type: [list]
  - name: yahoo
    disabled: false
